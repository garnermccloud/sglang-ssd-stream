name: Wheels

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64
            platform: amd64
          - target: aarch64
            platform: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python3.12
          manylinux: "2_28"
      - if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Test wheel
        run: |
          docker run --rm \
            --platform linux/${{ matrix.platform }} \
            --security-opt seccomp=unconfined \
            -v "$PWD:/work" \
            -w /work \
            python:3.12-bookworm \
            sh -c 'pip install -q dist/*.whl pytest && pytest -q tests/test_native_reader.py tests/test_cli.py tests/test_config.py'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
