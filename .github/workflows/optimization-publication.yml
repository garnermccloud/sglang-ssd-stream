name: Optimization publication

on:
  pull_request:
    paths:
      - "optimizations/**"
      - ".github/workflows/optimization-publication.yml"
  push:
    branches: [main]
    paths:
      - "optimizations/**"
      - ".github/workflows/optimization-publication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimizations/rtx-pro-6000-20260909
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify_bundle.py
      - run: python -m unittest discover -s tests -p test_publication.py -v
      - run: python -m compileall -q payload
